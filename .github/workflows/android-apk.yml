name: Build Antigravity Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Antigravity.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 3. Setup Android SDK Platform
        uses: android-actions/setup-android@v3

      - name: 🐘 4. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🛠️ 5. Auto-Repair Code, Icons & Wrappers
        run: |
          echo "==== Step 5: Auto-Repairing Android Assets & Code ===="
          # Fix gradlew CRLF line endings
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

          # Fix AutoRenew icon naming in Compose
          find app/src/ -name "*.kt" -exec sed -i 's/AutoRenew/Autorenew/g' {} +

          # Generate Gradle Wrapper if missing or corrupted
          gradle wrapper --gradle-version 8.5

          # Ensure required Android launcher drawables exist
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2563EB" android:pathData="M54,16 C33,16 16,33 16,54 C16,75 33,92 54,92 C75,92 92,75 92,54 Z"/>
              <path android:fillColor="#38BDF8" android:pathData="M54,36 L66,56 L42,56 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: 🚀 6. Compile & Build APK
        env:
          GRADLE_OPTS: "-Xmx3072m -Dfile.encoding=UTF-8"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: 📦 7. Package Antigravity.apk
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/Antigravity.apk
            echo "✅ Successfully built Antigravity.apk at release-output/Antigravity.apk"
            ls -lh release-output/Antigravity.apk
          else
            echo "❌ Error: APK file not found!"
            exit 1
          fi

      - name: 📤 8. Upload Antigravity-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-APK
          path: release-output/Antigravity.apk
          if-no-files-found: error
          retention-days: 90
