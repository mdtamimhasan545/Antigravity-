name: Build Android APK (Antigravity)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Antigravity APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make gradlew executable
        run: |
          chmod +x gradlew

      - name: 🚀 Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Prepare Antigravity.apk
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Antigravity.apk

      - name: 📤 Upload Antigravity.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-APK
          path: release-output/Antigravity.apk
          if-no-files-found: error
          retention-days: 90
